<style>
:root{--bg:#F5F5F0;--fg:#1A2E1A;--card:#FFFFFF;--border:#D4DDD0;--muted:#5C715C;--accent:#1B6B2A;--accent2:#D4A017;--row-hover:#EDF5ED;--green-dark:#14522A;--green-mid:#1B6B2A;--green-light:#2D8B3E;--yellow:#D4A017}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Segoe UI',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:22px 26px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 10px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;font-family:'JetBrains Mono',monospace;white-space:nowrap;user-select:none;border-bottom:2px solid var(--border)}
th.sortable{cursor:pointer}th.active{color:var(--green-dark)}
td{padding:8px 10px;font-size:11px;border-bottom:1px solid #E8EDE5}
tr:hover{background:var(--row-hover)!important}
input::placeholder{color:#8A9E8A}
select{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{height:6px}::-webkit-scrollbar-track{background:#E8EDE5}::-webkit-scrollbar-thumb{background:#B0C4A8;border-radius:3px}
.mono{font-family:'JetBrains Mono',monospace}.grotesk{font-family:'Space Grotesk',sans-serif}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:22px;box-shadow:0 1px 3px rgba(20,82,42,0.06)}
.kpi-strip{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;position:relative;overflow:hidden;flex:1 1 0;min-width:150px;box-shadow:0 1px 3px rgba(20,82,42,0.06)}
.stat .icon{position:absolute;top:-10px;right:-6px;font-size:48px;opacity:0.06;font-weight:900;line-height:1;font-family:'JetBrains Mono',monospace}
.stat .label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600;margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.stat .value{font-size:30px;font-weight:800;line-height:1.1;font-family:'Space Grotesk',sans-serif}
.stat .sub{font-size:11px;color:var(--muted);margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.grid-sm{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.grid-md{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.region-card{background:var(--bg);border-radius:8px;padding:12px 14px;cursor:pointer;border-left-width:3px;border-left-style:solid;transition:all 0.2s;border:1px solid var(--border)}
.region-card:hover{box-shadow:0 2px 8px rgba(20,82,42,0.1)}
.tab-bar{display:flex;gap:2px;margin-bottom:22px;background:var(--card);border-radius:8px;padding:3px;width:fit-content;border:1px solid var(--border)}
.tab-btn{padding:7px 22px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s}
.tab-btn.active{background:var(--accent);color:#fff}.tab-btn:not(.active){background:transparent;color:var(--muted)}.tab-btn:not(.active):hover{background:#EDF5ED}
.search-input{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:11px;font-family:'JetBrains Mono',monospace;width:190px;outline:none}.search-input:focus{border-color:var(--accent)}
.btn-download{padding:6px 13px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--green-dark);font-size:11px;font-weight:700;cursor:pointer;font-family:'JetBrains Mono',monospace;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:all 0.15s}
.btn-download:hover{background:#EDF5ED;border-color:var(--accent)}
.store-select{padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:12px;font-weight:600;width:320px;outline:none}.store-select:focus{border-color:var(--accent)}
.sev-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.wo-badge{font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;display:inline-flex;align-items:center;gap:4px}
.wo-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.bar-track{height:7px;background:#E8EDE5;border-radius:3px;overflow:hidden}.bar-fill{height:100%;border-radius:3px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.header-bar{background:var(--green-dark);color:#fff;margin:-22px -26px 22px;padding:18px 26px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
.header-bar h1{font-size:24px;font-weight:800;font-family:'Space Grotesk',sans-serif;letter-spacing:-0.5px;color:#fff}
.header-bar .sub{font-size:12px;color:#B8D4B0;margin-top:3px}.header-bar .date{font-size:11px;color:#B8D4B0;text-align:right;font-family:'JetBrains Mono',monospace}.header-bar .date strong{color:#fff;display:block;font-weight:600}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 8px rgba(212,160,23,0.7);animation:pulse 2s infinite;display:inline-block}
.accent-stripe{height:4px;background:linear-gradient(90deg,var(--green-dark),var(--green-mid),var(--yellow));margin:-22px -26px 22px}
.accordion{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--card)}
.accordion-head{padding:12px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background 0.15s;user-select:none}
.accordion-head:hover{background:#EDF5ED}
.accordion-arrow{transition:transform 0.2s;font-size:12px;color:var(--muted)}.accordion-arrow.open{transform:rotate(180deg)}
.accordion-body{border-top:1px solid var(--border)}
.store-row{padding:10px 16px 10px 32px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #E8EDE5;transition:background 0.15s}
.store-row:last-child{border-bottom:none}.store-row:hover{background:#EDF5ED}
.store-assets{background:var(--bg);padding:0 16px 0 32px;border-top:1px solid #E8EDE5}
.stack-bar{display:flex;border-radius:4px;overflow:hidden;height:10px;background:#E8EDE5}
.metric-pill{font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:3px}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-state .big{font-size:36px;margin-bottom:8px}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend-item{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace}
</style>

function categorize(days){
  if(days===null||days===undefined) return 'missing';
  if(days<0) return 'overdue';
  if(days<=30) return 'due30';
  if(days<=60) return 'due60';
  if(days<=90) return 'due90';
  return 'current';
}

function enrich(arr){
  const now=new Date();now.setHours(0,0,0,0);
  arr.forEach(r=>{
    r.regDate=r.regExp?new Date(r.regExp+'T00:00:00'):null;
    r.regDays=r.regDate?Math.round((r.regDate-now)/86400000):null;
    r.regCat=categorize(r.regDays);
    r.inspExempt=NO_INSPECTION_REQUIRED.has(r.type);
    r.inspDate=r.inspExp?new Date(r.inspExp+'T00:00:00'):null;
    r.inspDays=r.inspDate?Math.round((r.inspDate-now)/86400000):null;
    r.inspCat=(r.inspExempt&&!r.inspExp)?'exempt':categorize(r.inspDays);
    r.worstCat=RANK[r.regCat]<=RANK[r.inspCat]?r.regCat:r.inspCat;
    r.worstRank=RANK[r.worstCat];
    r.needsAttention=RANK[r.regCat]<=3||RANK[r.inspCat]<=3;
    const rd=r.regDays===null?Infinity:r.regDays,id=r.inspDays===null?Infinity:r.inspDays;
    r.minDays=Math.min(rd,id);
    r.gaps={plate:!r.plateNum,plateType:!r.plateType,reg:!r.regExp,insp:(r.inspCat==='missing')};
    r.gapCount=Object.values(r.gaps).filter(Boolean).length;
    r.hasGaps=r.gapCount>0;
  });
}

function deltaBadge(current,prior,lowerIsBetter=true){
  if(!state.compareMode) return '';
  const diff=current-prior;
  if(diff===0) return `<div style="font-size:10px;margin-top:4px;color:var(--muted);font-family:'JetBrains Mono',monospace">— no change vs prior</div>`;
  const improved=lowerIsBetter?diff<0:diff>0;
  const arrow=diff>0?'▲':'▼';
  const color=improved?'#1B6B2A':'#B91C1C';
  const sign=diff>0?'+':'';
  return `<div style="font-size:10px;margin-top:4px;color:${color};font-weight:700;font-family:'JetBrains Mono',monospace">${arrow} ${sign}${diff} vs prior report</div>`;
}

function dataGapBadges(r){
  if(!r.hasGaps) return `<span style="color:var(--muted);font-size:11px">—</span>`;
  const labels=[];
  if(r.gaps.plate)labels.push('NO PLATE');
  if(r.gaps.plateType)labels.push('NO TYPE');
  if(r.gaps.reg)labels.push('NO REG');
  if(r.gaps.insp)labels.push('NO INSP');
  return `<div style="display:flex;gap:3px;flex-wrap:wrap">${labels.map(l=>`<span class="sev-badge" style="color:#6B7280;background:rgba(107,114,128,0.10);border:1px solid #6B728022">${esc(l)}</span>`).join('')}</div>`;
}

function metricBadge(cat,days){
  const s=SEVC[cat];
  let txt;
  if(cat==='missing') txt='No record';
  else if(cat==='exempt') txt='Not required';
  else if(cat==='overdue') txt=`${Math.abs(days)}d overdue`;
  else txt=`${days}d left`;
  return`<span class="sev-badge" style="color:${s.c};background:${s.bg};border:1px solid ${s.c}22">${esc(txt)}</span>`;
}

function stackBar(items){
  const cats=['overdue','due30','due60','due90','missing','current','exempt'];
  const n=items.length||1;
  return`<div class="stack-bar">${cats.map(c=>{const cnt=items.filter(r=>r.worstCat===c).length;const pct=(cnt/n)*100;return pct>0?`<div style="width:${pct}%;background:${SEVC[c].c}" title="${SEVC[c].l}: ${cnt}"></div>`:''}).join('')}</div>`;
}

function calcGroup(items){
  const overdue=items.filter(r=>r.regCat==='overdue'||r.inspCat==='overdue').length;
  const due30=items.filter(r=>r.regCat==='due30'||r.inspCat==='due30').length;
  const missing=items.filter(r=>r.regCat==='missing'||r.inspCat==='missing').length;
  const stores=new Set(items.map(r=>r.store)).size;
  items.sort((a,b)=>a.worstRank-b.worstRank||a.minDays-b.minDays);
  return{items,count:items.length,overdue,due30,missing,stores};
}

function getStoresForRegion(rn){const src=getAttention().filter(r=>r.region===rn);const m={};src.forEach(r=>{if(!m[r.store])m[r.store]=[];m[r.store].push(r)});return Object.entries(m).map(([n,i])=>({name:n,...calcGroup([...i])})).sort((a,b)=>a.items[0].worstRank-b.items[0].worstRank||a.items[0].minDays-b.items[0].minDays)}

function thH(l,col,w,sortKey,dirKey,sortableFlag=true){

function handleSort(col,sortKey,dirKey){
  if(state[sortKey]===col)state[dirKey]=state[dirKey]==="desc"?"asc":"desc";

}
function sortData(data,sortKey,dirKey){
  const col=state[sortKey],dir=state[dirKey];
  return[...data].sort((a,b)=>{
    let av=a[col],bv=b[col];
    if(av===null||av===undefined)av=col==='minDays'?Infinity:-Infinity;
    if(bv===null||bv===undefined)bv=col==='minDays'?Infinity:-Infinity;
    if(typeof av==="string")return dir==="desc"?bv.localeCompare?String(bv).localeCompare(av):0:String(av).localeCompare(String(bv));
    return dir==="desc"?bv-av:av-bv;
  });
}

function statusText(cat,days){
  if(cat==='missing') return 'No Record';
  if(cat==='exempt') return 'Not Required';
  if(cat==='overdue') return `${Math.abs(days)}d overdue`;
  return `${days}d remaining`;
}
function rowsToCSV(rows){
  const header=['Asset','Class','Type','Store','Region','Status','Plate Type','Plate #','State','Registration Expires','Registration Status','Inspection Expires','Inspection Status','Data Gaps'];
  const lines=[header.map(csvVal).join(',')];
  rows.forEach(r=>{
    const gapLabels=[];
    if(r.gaps.plate)gapLabels.push('NO PLATE');
    if(r.gaps.plateType)gapLabels.push('NO TYPE');
    if(r.gaps.reg)gapLabels.push('NO REG');
    if(r.gaps.insp)gapLabels.push('NO INSP');
    const row=[r.asset,r.cls,r.type,r.store,r.region,r.status,r.plateType||'',r.plateNum||'',r.state||'',r.regExp||'',statusText(r.regCat,r.regDays),r.inspExp||'',statusText(r.inspCat,r.inspDays),gapLabels.join('; ')];
    lines.push(row.map(csvVal).join(','));
  });
  return lines.join('\r\n');
}
function downloadCSV(filename,csvContent){
  const blob=new Blob(["\ufeff"+csvContent],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportAttentionCSV(){
  const stamp=new Date().toISOString().slice(0,10);
  downloadCSV(`assets_needing_attention_${stamp}.csv`,rowsToCSV(filterAttention()));
}
function exportGapsCSV(){
  const stamp=new Date().toISOString().slice(0,10);
  downloadCSV(`assets_missing_data_${stamp}.csv`,rowsToCSV(filterGaps()));
}

}

  const overdue=items.filter(r=>r.regCat==='overdue'||r.inspCat==='overdue'||r.regCat==='missing');
  const regSoon=items.filter(r=>r.regCat!=='overdue'&&r.regCat!=='missing'&&r.regDays!==null&&r.regDays>=0&&r.regDays<=xDays);
  const inspNeeded=items.filter(r=>!r.inspExempt&&r.inspCat!=='overdue'&&(r.inspCat==='missing'||(r.inspDays!==null&&r.inspDays>=0&&r.inspDays<=xDays)));

  overdue.sort((a,b)=>{
    const av=Math.min(a.regCat==='overdue'?a.regDays:Infinity,a.inspCat==='overdue'?a.inspDays:Infinity);
    const bv=Math.min(b.regCat==='overdue'?b.regDays:Infinity,b.inspCat==='overdue'?b.inspDays:Infinity);
    return av-bv;
  });
  regSoon.sort((a,b)=>a.regDays-b.regDays);
  inspNeeded.sort((a,b)=>{
    const av=a.inspCat==='missing'?-1:a.inspDays,bv=b.inspCat==='missing'?-1:b.inspDays;
    return av-bv;
  });

  const dateStr=fmtDate(REPORT_DATE);
  const lines=[];
  lines.push(`Hi [Regional Manager],`);
  lines.push(``);
  lines.push(`Below is the current registration and inspection status for fleet assets in ${regionName} as of ${dateStr}. Please review and take action to renew registrations and schedule inspections as needed.`);
  lines.push(``);

  lines.push(`OVERDUE — IMMEDIATE ACTION NEEDED (${overdue.length})`);
  lines.push(`-`.repeat(45));
  if(overdue.length){
    overdue.forEach(r=>{
      const parts=[];
      if(r.regCat==='overdue') parts.push(`Registration expired ${Math.abs(r.regDays)}d ago (was due ${fmtDate(r.regDate)})`);
      if(r.regCat==='missing') parts.push(`No registration expiration on file — please verify`);
      if(r.inspCat==='overdue') parts.push(`Inspection expired ${Math.abs(r.inspDays)}d ago (was due ${fmtDate(r.inspDate)})`);
      lines.push(`- ${assetLabel(r)} — ${parts.join(' | ')}`);
    });
  } else {
    lines.push(`No assets are currently overdue in this region. Nice work!`);
  }
  lines.push(``);

  lines.push(`REGISTRATIONS EXPIRING IN THE NEXT ${xDays} DAYS (${regSoon.length})`);
  lines.push(`-`.repeat(45));
  if(regSoon.length){
    regSoon.forEach(r=>{
      lines.push(`- ${assetLabel(r)} — Registration expires ${fmtDate(r.regDate)} (${r.regDays}d)`);
    });
  } else {
    lines.push(`No registrations are expiring in the next ${xDays} days for this region.`);
  }
  lines.push(``);

  lines.push(`ASSETS NEEDING INSPECTION TO RENEW REGISTRATION (${inspNeeded.length})`);
  lines.push(`-`.repeat(45));
  if(inspNeeded.length){
    inspNeeded.forEach(r=>{
      if(r.inspCat==='missing') lines.push(`- ${assetLabel(r)} — No inspection on file — please schedule`);
      else lines.push(`- ${assetLabel(r)} — Inspection due ${fmtDate(r.inspDate)} (${r.inspDays}d)`);
    });
  } else {
    lines.push(`No assets currently need inspection in this region.`);
  }
  lines.push(``);
  lines.push(`If you have questions about any of the assets listed above, please reach out to Fleet Compliance.`);
  lines.push(``);
  lines.push(`Thank you,`);
  lines.push(`Fleet Compliance Team`);

  const subject=`Fleet Compliance Action Needed — ${regionName} — ${dateStr}`;
  const body=lines.join('\n');
  return{subject,body,overdue,regSoon,inspNeeded};
}

async function copyToClipboard(text,label){
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');}catch(err){}
    document.body.removeChild(ta);
  }
  state.copyMsg=`${label} copied to clipboard`;
  render();
  setTimeout(()=>{state.copyMsg="";render();},2200);
}

function copyEmailSubject(){
  const {subject}=generateEmail(state.emailRegion,state.emailDays);
  copyToClipboard(subject,'Subject');
}
function copyEmailBody(){
  const {body}=generateEmail(state.emailRegion,state.emailDays);
  copyToClipboard(body,'Email body');
}
function copyEmailAll(){
  const {subject,body}=generateEmail(state.emailRegion,state.emailDays);
  copyToClipboard(`Subject: ${subject}\n\n${body}`,'Subject + body');
}
function setEmailRegion(name){state.emailRegion=name;render()}
function setEmailDays(v){state.emailDays=Math.max(1,parseInt(v)||30);render()}
function goToEmailForRegion(name){state.tab='emails';state.emailRegion=name;render()}

function renderEmails(){
  const regions=REGION_ORDER.filter(r=>DATA.some(d=>d.region===r));
  const {subject,body,overdue,regSoon,inspNeeded}=generateEmail(state.emailRegion,state.emailDays);
  const regionCount=DATA.filter(r=>r.region===state.emailRegion).length;

  let o=`<div class="card">
    <div class="grotesk" style="font-size:13px;font-weight:700;margin-bottom:12px">Generate Regional Manager Email</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:4px">
      <div>
        <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Region</div>
        <select class="store-select" style="width:220px" onchange="setEmailRegion(this.value)">
          ${regions.map(r=>`<option value="${esc(r)}" ${state.emailRegion===r?'selected':''}>${esc(r)}</option>`).join('')}
        </select>
      </div>
      <div>
        <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Registrations/inspections due within (days)</div>
        <input type="number" min="1" max="365" value="${state.emailDays}" class="search-input" style="width:90px" onchange="setEmailDays(this.value)">
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-download" onclick="copyEmailAll()">⬇ Copy Subject + Body</button>
        <button class="btn-download" onclick="copyEmailSubject()">Copy Subject</button>
        <button class="btn-download" onclick="copyEmailBody()">Copy Body</button>
      </div>
      ${state.copyMsg?`<span class="mono" style="font-size:11px;color:var(--accent);font-weight:700">✓ ${esc(state.copyMsg)}</span>`:''}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px">${regionCount} total assets in ${esc(state.emailRegion)} · ${overdue.length} overdue · ${regSoon.length} registrations due ≤${state.emailDays}d · ${inspNeeded.length} need inspection</div>
  </div>`;

  o+=`<div class="card">
    <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Subject</div>
    <div class="mono" style="font-size:13px;font-weight:700;margin-bottom:16px;padding:10px 12px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">${esc(subject)}</div>
    <div class="mono" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Body — ready to paste into Outlook</div>
    <pre style="white-space:pre-wrap;word-break:break-word;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:16px;margin:0;max-height:520px;overflow-y:auto">${esc(body)}</pre>
  </div>`;

  return o;
}

function switchTab(tab){
  state.tab=tab;state.search="";state.gapSearch="";state.gapRegionFilter="";
  if(tab!=="regions"){state.openRegions={};state.openStores={}}
  render();
}

function render(){
  const now=REPORT_DATE.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const tabs=[{id:"summary",l:"Summary"},{id:"regions",l:"Region / Store"},{id:"lookup",l:"Store Lookup"},{id:"gaps",l:"Missing Info"},{id:"emails",l:"Email Drafts"}];
  let tb=tabs.map(t=>`<button class="tab-btn ${state.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.l}</button>`).join('');
  let content;
  if(state.tab==="summary")content=renderSummary();
  else if(state.tab==="regions")content=renderRegions();
  else if(state.tab==="lookup")content=renderStoreLookup();
  else if(state.tab==="gaps")content=renderGaps();
  else content=renderEmails();
  const attCount=getAttention().length;
  document.getElementById('app').innerHTML=`<div class="header-bar"><div><div style="display:flex;align-items:center;gap:10px;margin-bottom:4px"><span class="live-dot"></span><span class="mono" style="font-size:11px;color:var(--yellow);font-weight:700;letter-spacing:1.5px;text-transform:uppercase">FLEET COMPLIANCE — LIVE</span></div><h1>Registration &amp; Inspection Compliance</h1><p class="sub">McCoy's Building Supply · Fleet Compliance · ${attCount} of ${TOTAL} assets need attention (${(attCount/TOTAL*100).toFixed(1)}%)</p></div><div class="date"><div>Report generated</div><strong>${now}</strong></div></div><div class="accent-stripe"></div><div class="tab-bar">${tb}</div>${content}`;
}
render();
</script>
